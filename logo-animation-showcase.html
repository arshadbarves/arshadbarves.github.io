<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Logo Intro Animation Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Premium resets and dark cinema background */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Container for the logo & backlight */
    .showcase-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* Radial dark ambient glow behind everything */
    .ambient-radial-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(15, 15, 15, 0.8) 0%, rgba(0, 0, 0, 1) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Atmospheric projection light (breathing cinema projection glow) */
    .intro-backlight {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 45%, rgba(255, 255, 255, 0) 70%);
      filter: blur(60px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    /* Breathing backlight animation */
    .intro-backlight.animate {
      animation: backlight-breathe 4.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes backlight-breathe {
      0% {
        transform: translate(-50%, -50%) scale(0.4);
        opacity: 0;
        filter: blur(30px);
      }
      35% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 1;
        filter: blur(55px);
      }
      75% {
        transform: translate(-50%, -50%) scale(1.85);
        opacity: 0.95;
        filter: blur(85px);
        background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 50%, rgba(255, 255, 255, 0) 75%);
      }
      100% {
        transform: translate(-50%, -50%) scale(2.8);
        opacity: 0;
        filter: blur(140px);
      }
    }

    /* Logo Wrapper and entrance scaling */
    .logo-container {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.96);
      opacity: 0;
      filter: blur(10px);
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-container.show {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    .logo-container.intro-complete {
      transform: scale(1.1);
    }

    /* SVG Keyframes drawing animations */
    @keyframes svg-draw {
      from {
        stroke-dashoffset: 260;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes svg-fade-glow {
      from {
        opacity: 0;
        filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
      }
      to {
        opacity: 1;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.25));
      }
    }

    .logo-path-draw {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
    }
    
    .logo-path-draw.play {
      animation: svg-draw 3.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-path-delay-1 {
      animation-delay: 0.3s;
    }

    .logo-path-delay-2 {
      animation-delay: 0.6s;
    }

    .logo-rect-glow {
      opacity: 0;
    }
    
    .logo-rect-glow.play {
      animation: svg-fade-glow 2.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.0s;
    }

    /* Controller UI */
    .controls {
      position: absolute;
      bottom: 40px;
      z-index: 10;
      display: flex;
      gap: 16px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e4e4e7;
      padding: 10px 22px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.05);
    }

    .control-btn:active {
      transform: translateY(0);
    }
    
    .logo-text-desc {
      position: absolute;
      top: 40px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      z-index: 10;
      font-weight: 400;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="logo-text-desc">
    Interactive Monogram Intro Animation
  </div>

  <div class="showcase-container">
    <!-- Dark ambient backing -->
    <div class="ambient-radial-bg"></div>

    <!-- Breathing cinematic projection glow backlight -->
    <div id="backlight" class="intro-backlight"></div>

    <!-- Dynamic SVG Logo Monogram -->
    <div id="logo-wrapper" class="logo-container">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 100 100"
        width="144"
        height="144"
        fill="none"
        style="overflow: visible;"
      >
        <defs>
          <!-- Volumetric Badge Background — semi-transparent glassmorphic radial gradient -->
          <radialGradient id="logo-anim-badge-bg" cx="50%" cy="30%" r="75%">
            <stop offset="0%" stop-color="rgba(30, 30, 35, 0.85)" />
            <stop offset="50%" stop-color="rgba(18, 18, 20, 0.9)" />
            <stop offset="100%" stop-color="rgba(8, 8, 10, 0.95)" />
          </radialGradient>

          <!-- Beveled Border Gradient -->
          <linearGradient id="logo-anim-border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
            <stop offset="35%" stop-color="rgba(113, 113, 122, 0.15)" />
            <stop offset="100%" stop-color="rgba(0, 0, 0, 0.7)" />
          </linearGradient>

          <!-- Symmetrical Monogram Gradient -->
          <linearGradient id="logo-anim-mono" x1="30%" y1="20%" x2="70%" y2="80%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="45%" stop-color="#E4E4E7" />
            <stop offset="100%" stop-color="#52525B" />
          </linearGradient>

          <!-- Ambient Backlight/Glow backing the monogram -->
          <radialGradient id="logo-anim-glow" cx="50%" cy="50%" r="45%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
          </radialGradient>

          <!-- High-Fidelity Specular Shimmer Sweep -->
          <linearGradient id="logo-anim-shine" x1="-150%" y1="-150%" x2="-50%" y2="-50%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
            <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0" />
            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85" />
            <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            <!-- We will inject new animate nodes on play to reset SMIL timeline reliably -->
          </linearGradient>
        </defs>

        <!-- 1. Soft Ambient glow -->
        <circle cx="50" cy="50" r="35" fill="url(#logo-anim-glow)" />

        <!-- 2. Premium Squircle Badge Container -->
        <rect
          x="8" y="8"
          width="84" height="84"
          rx="26"
          fill="url(#logo-anim-badge-bg)"
          stroke="url(#logo-anim-border)"
          stroke-width="1.5"
          class="logo-rect-glow"
        />

        <!-- 3. Underlayer: Wide Ambient Specular Glow (Animated Draw) -->
        <g style="opacity: 0.15; filter: blur(2px);">
          <path
            d="M 32 70 L 46 38 Q 50 28 54 38 L 68 70"
            stroke="#FFFFFF"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="logo-path-draw logo-path-delay-1"
          />
          <path
            d="M 38 54 L 62 54"
            stroke="#FFFFFF"
            stroke-width="7"
            stroke-linecap="round"
            class="logo-path-draw logo-path-delay-2"
          />
        </g>

        <!-- 4. Foreground: Symmetrical Monogram Paths (Animated Draw) -->
        <g style="filter: drop-shadow(0 1.5px 3px rgba(0, 0, 0, 0.45));">
          <path
            d="M 32 70 L 46 38 Q 50 28 54 38 L 68 70"
            stroke="url(#logo-anim-mono)"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="logo-path-draw logo-path-delay-1"
          />
          <path
            d="M 38 54 L 62 54"
            stroke="url(#logo-anim-mono)"
            stroke-width="3.5"
            stroke-linecap="round"
            class="logo-path-draw logo-path-delay-2"
          />
        </g>

        <!-- 5. Animated Specular Shimmer Sweep Overlay -->
        <g style="mix-blend-mode: overlay; opacity: 0.95;">
          <rect
            x="8" y="8"
            width="84" height="84"
            rx="26"
            stroke="url(#logo-anim-shine)"
            stroke-width="2.0"
          />
          <path
            d="M 32 70 L 46 38 Q 50 28 54 38 L 68 70"
            stroke="url(#logo-anim-shine)"
            stroke-width="3.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M 38 54 L 62 54"
            stroke="url(#logo-anim-shine)"
            stroke-width="3.8"
            stroke-linecap="round"
          />
        </g>
      </svg>
    </div>

    <!-- Interface controls -->
    <div class="controls">
      <button class="control-btn" onclick="replayAnimation()">Replay Animation</button>
    </div>
  </div>

  <script>
    function replayAnimation() {
      const container = document.getElementById('logo-wrapper');
      const backlight = document.getElementById('backlight');
      
      // 1. Instantly hide and reset styles
      container.classList.remove('show', 'intro-complete');
      backlight.classList.remove('animate');
      
      // Reset CSS class states for the SVG child paths to restart animations
      const paths = container.querySelectorAll('.logo-path-draw');
      const rect = container.querySelector('.logo-rect-glow');
      
      rect.classList.remove('play');
      paths.forEach(path => path.classList.remove('play'));

      // Remove existing animation elements from linearGradient def to force clean reset
      const shineGrad = container.querySelector('#logo-anim-shine');
      const oldAnimates = shineGrad.querySelectorAll('animate');
      oldAnimates.forEach(el => el.remove());

      // Force a layout recalculation/repaint to process the style removal
      void container.offsetWidth;

      // 2. Play intro sequence
      setTimeout(() => {
        container.classList.add('show');
        backlight.classList.add('animate');
        
        rect.classList.add('play');
        paths.forEach(path => path.classList.add('play'));

        // Inject fresh SMIL animation elements inside the gradient definitions
        // to reset the shimmer sweep timeline reliably.
        const animConfigs = [
          { attributeName: 'x1', from: '-150%', to: '150%' },
          { attributeName: 'y1', from: '-150%', to: '150%' },
          { attributeName: 'x2', from: '-50%', to: '250%' },
          { attributeName: 'y2', from: '-50%', to: '250%' }
        ];

        animConfigs.forEach(cfg => {
          const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          anim.setAttribute('attributeName', cfg.attributeName);
          anim.setAttribute('from', cfg.from);
          anim.setAttribute('to', cfg.to);
          anim.setAttribute('dur', '2.4s');
          anim.setAttribute('begin', '1.8s');
          anim.setAttribute('fill', 'freeze');
          anim.setAttribute('repeatCount', '1');
          shineGrad.appendChild(anim);
        });

      }, 150);

      // 3. Complete expansion scale
      setTimeout(() => {
        container.classList.add('intro-complete');
      }, 4800);
    }

    // Auto-play on first window load
    window.addEventListener('DOMContentLoaded', () => {
      replayAnimation();
    });
  </script>
</body>
</html>
